    <!-- This script puts the exact canonical URL of the page into the <head> dynamically,

    <!-- <link rel="canonical" href="https://www.copperwheats.co.uk/about.html" /> -->
    <script>
        (function() {
            // 1. Check for an existing canonical tag, or create one if missing
            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
            canonicalLink = document.createElement('link');
            canonicalLink.setAttribute('rel', 'canonical');
            document.head.appendChild(canonicalLink);
            }
            
            // 2. Clean pathname by stripping /index.html if present at the end
            const cleanPath = window.location.pathname.replace(/\/index\.html$/i, '/');
            
            // 3. Construct clean URL
            const currentUrl = window.location.protocol + '//' + window.location.host + cleanPath;
            
            // 4. Update the href attribute
            canonicalLink.setAttribute('href', currentUrl);
        })();
    </script>
